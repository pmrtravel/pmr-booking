<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c1312" />
  <title>我的訂單｜PMR 旅遊規劃</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20260926c" />
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="brand"><span class="brand-mark">PMR</span><span>TRAVEL STUDIO</span></div>
      <p class="eyebrow">MY ORDERS · LOOKUP</p>
      <h1>查詢<em>我的訂單。</em></h1>
      <p class="intro">輸入訂購時留下的手機號碼，即可查看已預訂張數、已開票與尚未開票的張數。</p>
      <a class="hero-link" href="./"><span aria-hidden="true">←</span> 回到預約表單</a>
      <div class="hero-foot"><div><span>✦</span> 即時查詢</div><div><span>✦</span> 專人服務</div><div><span>✦</span> 資料保護</div></div>
    </section>

    <section class="form-panel">
      <div class="panel-heading"><p>ORDER LOOKUP</p><h2>我的訂單</h2><span>請輸入訂購人手機號碼</span></div>
      <form id="lookupForm" class="lookup-card" novalidate>
        <label>訂購人手機號碼<input name="phone" id="phone" inputmode="tel" autocomplete="tel" maxlength="16" placeholder="09xx-xxx-xxx" /></label>
        <button class="submit" type="submit"><span>查詢我的訂單</span><span>→</span></button>
        <p class="form-status" id="lookupStatus" aria-live="polite"></p>
      </form>
      <section id="result" hidden aria-live="polite"></section>
    </section>
  </main>
  <dialog id="detailDialog" aria-label="詳細資訊">
    <button type="button" class="d-close" aria-label="關閉">×</button>
    <div class="d-body"></div>
  </dialog>
  <script src="./my-orders.js?v=20260926c"></script>
</body>
</html>
